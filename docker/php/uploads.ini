; Batas unggah & memori PHP untuk foto dokumentasi.
; Image php:8.3-fpm-alpine default-nya upload_max_filesize=2M & post_max_size=8M,
; sehingga foto kamera/HP (umumnya 3-8MB) gagal diunggah ("The file failed to
; upload."). Aplikasi membatasi 5MB per foto; beri ruang lebih di level PHP agar
; validasi aplikasi yang berlaku, bukan batas PHP. memory_limit dinaikkan karena
; kompresi/thumbnail foto resolusi tinggi (mis. 6000x4000) butuh memori GD besar.
upload_max_filesize = 15M
post_max_size = 20M
memory_limit = 256M
max_file_uploads = 30
max_execution_time = 120
